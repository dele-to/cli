[package]
name = "deleto"
version = "0.1.1"
edition = "2021"
description = "Encrypt locally and share through dele.to's opaque API"
license = "MIT"
repository = "https://github.com/dele-to/dele-to"
keywords = ["secrets", "share", "encryption", "cli"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "deleto"
path = "src/lib.rs"

[[bin]]
name = "deleto"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
arboard = "3"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env", "wrap_help", "color"] }
crossterm = "0.28"
hkdf = "0.12"
humantime = "2"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tui-textarea = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
